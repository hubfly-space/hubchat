<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Status }} · Hubchat</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 8px;
        padding: 24px;
        text-align: center;
        background: #0a0b0d;
        color: #e9ebef;
        font: 400 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.006em;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 560; letter-spacing: -0.014em; }
      p { margin: 0; color: #848b99; font-size: 13px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        color: #5f6878;
      }
      a { color: #6b8ef9; text-underline-offset: 3px; }
      @media (prefers-color-scheme: light) {
        body { background: #f7f8fa; color: #0a0b0d; }
        p { color: #5f6878; }
        a { color: #2a57d8; }
      }
    </style>
  </head>
  <body>
    <h1>{{ .Title }}</h1>
    <p>{{ .Message }}</p>
    {{ if .RequestID }}<p><code>{{ .RequestID }}</code></p>{{ end }}
    <p><a href="/">Return to the start</a></p>
  </body>
</html>
