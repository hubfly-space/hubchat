# Local development dependencies.
#
# Production needs PostgreSQL and nothing else — SMTP and object storage are
# optional adapters (§8.1). They are here so the email channel and attachment
# code paths can be exercised locally without signing up for anything, not
# because Hubchat requires them.
#
#   make dev-db     start
#   make dev-db-down  stop and keep data
#   make dev-db-reset stop and destroy data

name: hubchat

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hubchat
      POSTGRES_PASSWORD: hubchat
      POSTGRES_DB: hubchat
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      # Dev-only tuning: log anything slower than 200ms so a missing workspace
      # predicate (§11.3) shows up while writing the query, not in production.
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubchat -d hubchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Outbound SMTP sink. Catches every mail the binary sends; read them at
  # http://localhost:8025 instead of wiring a real provider.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    logging:
      driver: none # MailHog logs every connection at info; drowns out everything else

  # S3-compatible storage for exercising the non-default file backend.
  # The default backend is local disk, so this is only needed when working on
  # internal/file's S3 adapter.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hubchat
      MINIO_ROOT_PASSWORD: hubchat-dev-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket the S3 adapter expects, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hubchat hubchat-dev-secret &&
      mc mb --ignore-existing local/hubchat &&
      mc anonymous set none local/hubchat
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
