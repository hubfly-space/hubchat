name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build embedded browser assets
        run: make web
      - run: make check
      - run: make build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hubchat
          POSTGRES_PASSWORD: hubchat
          POSTGRES_DB: hubchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hubchat -d hubchat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build embedded browser assets
        run: make web
      - run: HUBCHAT_TEST_DATABASE_URL='postgres://hubchat:hubchat@localhost:5432/hubchat_test?sslmode=disable' make test-integration

  capacity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hubchat
          POSTGRES_PASSWORD: hubchat
          POSTGRES_DB: hubchat_capacity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hubchat -d hubchat_capacity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build embedded browser assets
        run: make web
      - name: Migrate capacity database
        run: HUBCHAT_DATABASE_URL='postgres://hubchat:hubchat@localhost:5432/hubchat_capacity?sslmode=disable' go run ./cmd/hubchat migrate
      - name: Run PostgreSQL capacity gate
        run: HUBCHAT_TEST_DATABASE_URL='postgres://hubchat:hubchat@localhost:5432/hubchat_capacity?sslmode=disable' make test-capacity

  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: Start provider services
        run: docker compose up -d mailhog minio minio-init
      - name: Run provider adapter gate
        run: make provider-check

  release-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hubchat
          POSTGRES_PASSWORD: hubchat
          POSTGRES_DB: hubchat_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hubchat -d hubchat_release"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run compiled production binary smoke
        env:
          HUBCHAT_BINARY_DATABASE_URL: postgres://hubchat:hubchat@localhost:5432/hubchat_release?sslmode=disable
        run: make production-binary-check
