<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hubchat</title>

    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />

    <!--
      Sets the theme attribute before first paint. Without this an agent who
      chose light mode gets a dark flash on every reload, and vice versa.
      Loaded from the same origin so the CSP does not permit inline scripts.
    -->
    <script src="/app/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
